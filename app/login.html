<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b31318" />
  <title>AARIKA | Sign in</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f7fa}
    *{box-sizing:border-box} body{margin:0;min-height:100vh}.page{min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(440px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:36px;box-shadow:0 18px 50px rgba(0,0,0,.08)}
    .mark{width:64px;height:64px;border-radius:16px;background:#b31318;color:#fff;display:grid;place-items:center;font-size:36px;font-weight:800;margin-bottom:24px}
    .eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:#b31318}.title{font-size:36px;margin:8px 0}.sub{color:#666;line-height:1.5}
    button{width:100%;margin-top:28px;padding:14px 18px;border:1px solid #d1d5db;border-radius:12px;background:#fff;font-size:16px;font-weight:700;cursor:pointer}
    button:hover{background:#f8fafc}.error{margin-top:16px;padding:12px;border-radius:10px;background:#fff1f2;color:#9f1239;font-size:14px}.note{margin-top:20px;color:#777;font-size:12px;text-align:center}
  </style>
</head>
<body>
  <main class="page"><section class="card">
    <div class="mark">A</div><div class="eyebrow">BAL JYOTI PUBLIC SCHOOL</div>
    <h1 class="title">AARIKA</h1><p class="sub">Sign in with your authorised Bal Jyoti Google account.</p>
    <button id="googleSignIn" type="button">Continue with Google</button>
    <div id="loginError" class="error" hidden></div>
    <div class="note">Only authorised @baljyoti.com accounts can access AARIKA.</div>
  </section></main>
  <script type="module">
    import { getAarikaFirebase } from './firebase.js';
    import { GoogleAuthProvider, getRedirectResult, onAuthStateChanged, signInWithRedirect, signOut } from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';

    const button = document.getElementById('googleSignIn');
    const error = document.getElementById('loginError');
    const ALLOWED_DOMAIN = 'baljyoti.com';

    function showError(message) {
      error.hidden = false;
      error.textContent = message;
    }

    function goToDashboard() {
      window.location.replace('./dashboard.html');
    }

    try {
      const { auth } = getAarikaFirebase();
      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ hd: ALLOWED_DOMAIN, prompt: 'select_account' });

      // Complete a Google redirect, if this page is returning from Google.
      getRedirectResult(auth).then(async result => {
        if (!result?.user) return;

        const email = (result.user.email || '').toLowerCase();
        if (!result.user.emailVerified || !email.endsWith('@' + ALLOWED_DOMAIN)) {
          await signOut(auth);
          showError('Please use your authorised @baljyoti.com account.');
          return;
        }
        goToDashboard();
      }).catch(e => {
        console.error('AARIKA redirect login failed', e);
        showError(e.message || 'Unable to complete Google sign-in.');
      });

      onAuthStateChanged(auth, user => {
        if (user?.email?.toLowerCase().endsWith('@' + ALLOWED_DOMAIN)) {
          goToDashboard();
        }
      });

      button.addEventListener('click', async () => {
        error.hidden = true;
        button.disabled = true;
        button.textContent = 'Redirecting to Google…';
        try {
          await signInWithRedirect(auth, provider);
        } catch (e) {
          console.error('AARIKA login failed', e);
          showError(e.message || 'Unable to sign in. Please try again.');
          button.disabled = false;
          button.textContent = 'Continue with Google';
        }
      });
    } catch (e) {
      console.error(e);
      button.disabled = true;
      showError(e.message || 'AARIKA Firebase is not configured.');
    }
  </script>
</body>
</html>
