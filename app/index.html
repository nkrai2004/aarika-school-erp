<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b31318" />
  <meta name="description" content="AARIKA School Management & Learning Platform" />
  <title>AARIKA | School ERP</title>
  <style>
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #171717; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(720px, 100%); background: #fff; border: 1px solid #e5e7eb; border-radius: 24px; padding: 48px; box-shadow: 0 18px 50px rgba(0,0,0,.07); }
    .mark { width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; background: #b31318; color: #fff; font-size: 42px; font-weight: 800; margin-bottom: 28px; }
    .eyebrow { color: #b31318; font-weight: 800; letter-spacing: .18em; font-size: 14px; }
    h1 { margin: 12px 0 8px; font-size: clamp(36px, 7vw, 56px); line-height: 1; }
    p { color: #666; font-size: 18px; line-height: 1.6; margin: 0; }
    .status { margin-top: 32px; padding: 16px 18px; border-radius: 14px; background: #f8fafc; border: 1px solid #e5e7eb; font-size: 14px; color: #475569; }
    .footer { margin-top: 28px; font-size: 13px; color: #8a8a8a; }
    @media (max-width: 560px) { .card { padding: 32px 24px; border-radius: 20px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <div class="mark" aria-hidden="true">A</div>
      <div class="eyebrow">BAL JYOTI PUBLIC SCHOOL</div>
      <h1 id="title">AARIKA</h1>
      <p>School Management &amp; Learning Platform</p>
      <div class="status">Application foundation is ready. Authentication, school data, roles, and operational modules will be added in controlled phases.</div>
      <div class="footer">AARIKA • Foundation • Phase 0</div>
    </section>
  </main>
</body>
</html>
