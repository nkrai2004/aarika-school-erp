<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b31318" />
  <meta name="description" content="AARIKA School Management & Learning Platform" />
  <title>AARIKA | School ERP</title>
  <style>
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#171717; background:#f5f7fa; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; }
    .shell { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { width:min(520px,100%); background:#fff; border:1px solid #e5e7eb; border-radius:24px; padding:40px; box-shadow:0 18px 50px rgba(0,0,0,.07); }
    .mark { width:68px; height:68px; border-radius:18px; display:grid; place-items:center; background:#b31318; color:#fff; font-size:40px; font-weight:800; margin-bottom:24px; }
    .eyebrow { color:#b31318; font-weight:800; letter-spacing:.16em; font-size:12px; }
    h1 { margin:10px 0 8px; font-size:48px; line-height:1; }
    .sub { color:#666; font-size:17px; margin:0; line-height:1.5; }
    button { width:100%; margin-top:28px; min-height:50px; border:0; border-radius:12px; background:#b31318; color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    button.secondary { background:#fff; color:#b31318; border:1px solid #ddd; margin-top:12px; }
    .status { margin-top:18px; padding:14px 16px; border-radius:12px; background:#f8fafc; border:1px solid #e5e7eb; font-size:13px; line-height:1.5; color:#475569; }
    .status[data-error="true"] { color:#991b1b; background:#fef2f2; border-color:#fecaca; }
    .user { margin-top:18px; padding:12px 14px; border-radius:10px; background:#f1f5f9; font-size:13px; }
    .footer { margin-top:24px; text-align:center; font-size:12px; color:#999; }
    [hidden] { display:none !important; }
    @media(max-width:560px){ .card{padding:30px 22px;border-radius:20px;} h1{font-size:42px;} }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="title">
      <div class="mark" aria-hidden="true">A</div>
      <div class="eyebrow">BAL JYOTI PUBLIC SCHOOL</div>
      <h1 id="title">AARIKA</h1>
      <p class="sub">School Management &amp; Learning Platform</p>
      <button id="googleLogin" type="button">Continue with Google</button>
      <button id="logoutButton" class="secondary" type="button" hidden>Sign out</button>
      <div id="userPanel" class="user" hidden></div>
      <div id="status" class="status" role="status">Loading AARIKA…</div>
      <div class="footer">AARIKA • Secure school operations</div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
